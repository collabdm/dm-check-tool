<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>DM Check</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✉️</text></svg>">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:#0f0f14;
      background-image:
        radial-gradient(ellipse 600px 400px at 20% 30%, rgba(99,102,241,0.08), transparent),
        radial-gradient(ellipse 500px 350px at 80% 70%, rgba(236,72,153,0.06), transparent);
    }

    .container {
      width:100%;
      max-width:440px;
    }

    .header {
      text-align:center;
      margin-bottom:32px;
    }

    .logo {
      width:56px;
      height:56px;
      border-radius:16px;
      background:linear-gradient(135deg, #6366f1, #ec4899);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      margin-bottom:16px;
      box-shadow:0 8px 32px rgba(99,102,241,0.25);
    }

    .title {
      font-size:28px;
      font-weight:800;
      color:#fff;
      letter-spacing:-0.5px;
      margin-bottom:8px;
    }

    .subtitle {
      font-size:15px;
      color:#6b7280;
      line-height:1.5;
    }

    .search-box {
      background:#1a1a24;
      border:1px solid rgba(255,255,255,0.06);
      border-radius:20px;
      padding:24px;
      box-shadow:0 4px 24px rgba(0,0,0,0.3);
    }

    .input-wrapper {
      position:relative;
      margin-bottom:16px;
    }

    .input-wrapper svg {
      position:absolute;
      left:18px;
      top:50%;
      transform:translateY(-50%);
      color:#4b5563;
      pointer-events:none;
    }

    input {
      width:100%;
      padding:18px 20px 18px 50px;
      background:#12121a;
      border:2px solid rgba(255,255,255,0.06);
      border-radius:14px;
      color:#fff;
      font-family:'Inter', sans-serif;
      font-size:17px;
      font-weight:500;
      outline:none;
      transition:border-color 0.2s;
    }

    input:focus {
      border-color:rgba(99,102,241,0.5);
    }

    input::placeholder {
      color:#3f3f4e;
      font-weight:400;
    }

    .btn {
      width:100%;
      padding:18px;
      border:none;
      border-radius:14px;
      font-family:'Inter', sans-serif;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
      transition:all 0.2s;
      background:linear-gradient(135deg, #6366f1, #8b5cf6);
      color:#fff;
      box-shadow:0 4px 16px rgba(99,102,241,0.3);
      letter-spacing:0.3px;
    }

    .btn:hover {
      transform:translateY(-1px);
      box-shadow:0 6px 24px rgba(99,102,241,0.4);
    }

    .btn:active {
      transform:translateY(0);
    }

    .btn:disabled {
      background:#2a2a3a;
      color:#555;
      cursor:not-allowed;
      box-shadow:none;
      transform:none;
    }

    .spinner {
      display:inline-block;
      width:18px;
      height:18px;
      border:2.5px solid rgba(255,255,255,0.15);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin 0.7s linear infinite;
      vertical-align:middle;
      margin-right:8px;
    }

    @keyframes spin { to { transform:rotate(360deg); } }

    .error {
      font-size:14px;
      color:#f87171;
      text-align:center;
      min-height:20px;
      margin-top:-8px;
      margin-bottom:8px;
    }

    .result {
      display:none;
      margin-top:20px;
      padding:28px 24px;
      border-radius:16px;
      text-align:center;
      animation:fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity:0; transform:translateY(8px); }
      to { opacity:1; transform:translateY(0); }
    }

    .result-safe {
      background:rgba(34,197,94,0.08);
      border:1px solid rgba(34,197,94,0.2);
    }

    .result-blocked {
      background:rgba(239,68,68,0.08);
      border:1px solid rgba(239,68,68,0.2);
    }

    .result-icon {
      width:64px;
      height:64px;
      border-radius:50%;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-size:32px;
      margin-bottom:16px;
    }

    .result-safe .result-icon {
      background:rgba(34,197,94,0.12);
    }

    .result-blocked .result-icon {
      background:rgba(239,68,68,0.12);
    }

    .result-title {
      font-size:22px;
      font-weight:700;
      margin-bottom:6px;
    }

    .result-safe .result-title { color:#4ade80; }
    .result-blocked .result-title { color:#f87171; }

    .result-desc {
      font-size:15px;
      color:#6b7280;
      margin-bottom:18px;
      line-height:1.5;
    }

    .profile-link {
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:14px 28px;
      background:linear-gradient(135deg, #1d9bf0, #1a8cd8);
      color:#fff;
      border-radius:12px;
      text-decoration:none;
      font-family:'Inter', sans-serif;
      font-size:15px;
      font-weight:600;
      transition:all 0.2s;
      box-shadow:0 4px 16px rgba(29,155,240,0.3);
    }

    .profile-link:hover {
      transform:translateY(-1px);
      box-shadow:0 6px 20px rgba(29,155,240,0.4);
    }

    .history {
      margin-top:28px;
    }

    .history-header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:12px;
    }

    .history-title {
      font-size:13px;
      font-weight:600;
      color:#4b5563;
      text-transform:uppercase;
      letter-spacing:0.5px;
    }

    .history-clear {
      font-size:13px;
      color:#6b7280;
      background:none;
      border:none;
      cursor:pointer;
      font-family:'Inter', sans-serif;
      padding:4px 8px;
      border-radius:6px;
      transition:all 0.2s;
    }

    .history-clear:hover {
      background:rgba(255,255,255,0.05);
      color:#9ca3af;
    }

    .history-list {
      background:#1a1a24;
      border:1px solid rgba(255,255,255,0.04);
      border-radius:14px;
      overflow:hidden;
    }

    .history-item {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:14px 18px;
      border-bottom:1px solid rgba(255,255,255,0.03);
    }

    .history-item:last-child {
      border-bottom:none;
    }

    .history-user {
      font-size:15px;
      font-weight:600;
      color:#e5e7eb;
    }

    .history-badge {
      font-size:12px;
      font-weight:700;
      padding:4px 10px;
      border-radius:20px;
      text-transform:uppercase;
      letter-spacing:0.5px;
    }

    .badge-safe {
      background:rgba(34,197,94,0.12);
      color:#4ade80;
    }

    .badge-used {
      background:rgba(239,68,68,0.12);
      color:#f87171;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo">✉️</div>
      <div class="title">DM Check</div>
      <div class="subtitle">Verify if a user has already been contacted</div>
    </div>

    <div class="search-box">
      <div class="input-wrapper">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="M21 21l-4.35-4.35"></path>
        </svg>
        <input type="text" id="dm-username" placeholder="Enter @username" autocomplete="off">
      </div>
      <div class="error" id="dm-error"></div>
      <button class="btn" id="dm-btn" onclick="checkDm()">Check Username</button>

      <div class="result" id="dm-result-safe">
        <div class="result-icon">✅</div>
        <div class="result-title">Safe to DM</div>
        <div class="result-desc">This user hasn't been contacted yet. You're free to reach out!</div>
        <a class="profile-link" id="dm-profile-link" href="#" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
          View Profile
        </a>
      </div>

      <div class="result" id="dm-result-blocked">
        <div class="result-icon">⚠️</div>
        <div class="result-title">Already Contacted</div>
        <div class="result-desc">This user has already been DM'd by a team member.</div>
      </div>
    </div>

    <div class="history" id="dm-history"></div>
  </div>

  <script>
    const DM_SHEETS_URL = 'https://script.google.com/macros/s/AKfycbydYa2p5RMATHrp__0_FmT7Q7JcakHHrPevWktJd5yu3fxN_dvHsGPLJtcTMpBu4HgqZw/exec';

    async function checkUsername(username) {
      try {
        var resp = await fetch(DM_SHEETS_URL + '?type=username&value=' + encodeURIComponent(username), { mode: 'cors', signal: AbortSignal.timeout(10000) });
        var data = await resp.json();
        return data.exists;
      } catch(e) { return true; }
    }

    async function saveUsername(username) {
      try {
        fetch(DM_SHEETS_URL, {
          method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, timestamp: new Date().toISOString() })
        }).catch(function(){});
      } catch(e) {}
    }

    function getHistory() {
      try { return JSON.parse(localStorage.getItem('dm_history') || '[]'); } catch(e) { return []; }
    }

    function addHistory(username, safe) {
      var h = getHistory();
      h.unshift({ user: username, safe: safe });
      if (h.length > 30) h = h.slice(0, 30);
      localStorage.setItem('dm_history', JSON.stringify(h));
    }

    function clearHistory() {
      localStorage.removeItem('dm_history');
      renderHistory();
    }

    function renderHistory() {
      var h = getHistory();
      var el = document.getElementById('dm-history');
      if (h.length === 0) { el.innerHTML = ''; return; }
      var html = '<div class="history-header"><span class="history-title">Recent Checks</span><button class="history-clear" onclick="clearHistory()">Clear</button></div><div class="history-list">';
      for (var i = 0; i < h.length; i++) {
        html += '<div class="history-item"><span class="history-user">' + h[i].user + '</span><span class="history-badge ' + (h[i].safe ? 'badge-safe' : 'badge-used') + '">' + (h[i].safe ? 'Safe' : 'Contacted') + '</span></div>';
      }
      html += '</div>';
      el.innerHTML = html;
    }

    async function checkDm() {
      var input = document.getElementById('dm-username');
      var errEl = document.getElementById('dm-error');
      var btn = document.getElementById('dm-btn');
      var resultSafe = document.getElementById('dm-result-safe');
      var resultBlocked = document.getElementById('dm-result-blocked');

      resultSafe.style.display = 'none';
      resultBlocked.style.display = 'none';
      errEl.textContent = '';

      var u = input.value.trim();
      if (!u) { errEl.textContent = 'Please enter a username'; return; }
      if (!u.startsWith('@')) u = '@' + u;
      if (u === '@') { errEl.textContent = 'Please enter a valid username'; return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Checking...';

      var exists = await checkUsername(u);

      btn.disabled = false;
      btn.textContent = 'Check Username';

      if (exists) {
        resultBlocked.style.display = 'block';
        addHistory(u, false);
      } else {
        saveUsername(u);
        document.getElementById('dm-profile-link').href = 'https://x.com/' + u.replace('@', '');
        resultSafe.style.display = 'block';
        addHistory(u, true);
      }

      renderHistory();
      input.value = '';
    }

    document.getElementById('dm-username').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') checkDm();
    });

    renderHistory();
  </script>

</body>
</html>
